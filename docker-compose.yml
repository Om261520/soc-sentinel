version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./soc_sentinel.db
      - JWT_SECRET_KEY=soc_sentinel_super_secret_jwt_key_2026_change_in_prod
    volumes:
      - ./backend/soc_sentinel.db:/app/soc_sentinel.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
